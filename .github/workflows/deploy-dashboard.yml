name: Deploy dashboard to Cloudflare Workers

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/dashboard/**"
      - "tools/video-project-api/**"
      - ".github/workflows/deploy-dashboard.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/dashboard/**"
      - "tools/video-project-api/**"
      - ".github/workflows/deploy-dashboard.yml"

permissions:
  contents: read

concurrency:
  group: dashboard-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate dashboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            apps/dashboard/pnpm-lock.yaml
            tools/video-project-api/pnpm-lock.yaml
      - name: Install locked dependencies
        run: |
          pnpm --dir apps/dashboard install --frozen-lockfile
          pnpm --dir tools/video-project-api install --frozen-lockfile
      - name: Check types and tests
        run: |
          pnpm --dir apps/dashboard typecheck
          pnpm --dir apps/dashboard test
      - name: Build Worker and browser assets
        run: pnpm --dir apps/dashboard build

  deploy:
    name: Deploy production dashboard
    needs: validate
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://dash.veobible.com
    defaults:
      run:
        working-directory: apps/dashboard
    env:
      DASHBOARD_D1_DATABASE_ID: ${{ vars.DASHBOARD_D1_DATABASE_ID }}
      DASHBOARD_D1_DATABASE_NAME: ${{ vars.DASHBOARD_D1_DATABASE_NAME }}
      DASHBOARD_VIDEO_API_URL: ${{ vars.DASHBOARD_VIDEO_API_URL }}
      DASHBOARD_DOMAIN: ${{ vars.DASHBOARD_DOMAIN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            apps/dashboard/pnpm-lock.yaml
            tools/video-project-api/pnpm-lock.yaml
      - name: Install locked dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir ../../tools/video-project-api install --frozen-lockfile
      - name: Build production Worker
        run: pnpm build:production
      - name: Verify deployment configuration and bundle
        run: |
          pnpm deploy:production --check
          pnpm deploy:production --dry-run
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          PROXY_API_TOKEN: ${{ secrets.PROXY_API_TOKEN }}
          DASHBOARD_PUBLISH_API_TOKEN: ${{ secrets.DASHBOARD_PUBLISH_API_TOKEN }}
          DASHBOARD_PUBLISH_ACCOUNT_ID: ${{ vars.DASHBOARD_PUBLISH_ACCOUNT_ID }}
      - name: Apply production database migrations
        run: pnpm db:migrate:remote
      - name: Deploy Worker and runtime secrets
        run: pnpm deploy:production
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          PROXY_API_TOKEN: ${{ secrets.PROXY_API_TOKEN }}
          DASHBOARD_PUBLISH_API_TOKEN: ${{ secrets.DASHBOARD_PUBLISH_API_TOKEN }}
          DASHBOARD_PUBLISH_ACCOUNT_ID: ${{ vars.DASHBOARD_PUBLISH_ACCOUNT_ID }}
